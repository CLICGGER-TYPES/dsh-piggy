html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
[data-dsh-pig],[data-dsh-pig] *{pointer-events:auto}
</style>

<script>
// 和桌面版 loader.js 一样：client.js 把入口交给这里，bootstrap 再决定网页版或扩展大窗。
window.__stageEntry = null;
window.__ModuleLoader__ = { load: function (entry) { window.__stageEntry = entry } };
</script>
<script src="/client.js"></script>
<script type="module" src="/stage/bootstrap.js"></script>
</body>
