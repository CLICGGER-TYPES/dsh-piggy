<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>dsh-piggy</title>
<style>
  :root { color-scheme: light; }
  html, body { overflow: hidden; }
  body { margin: 0; font: 15px/1.6 "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif; background: #f8f8f0; color: #6b5a47; }
  main { padding: 22px 24px; }
  h1 { margin: 0 0 6px; font-size: 17px; color: #4f3f2f; }
  .bar { height: 10px; margin: 14px 0 6px; border-radius: 5px; background: #e7e2d3; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #1cc4a8; transition: width .2s; }
  .error { color: #c0533a; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; padding: 7px 0; border: 2px solid #d9cfb8; border-radius: 16px; background: #fff; color: #6b5a47; font: inherit; font-weight: 700; cursor: pointer; }
  button.main { background: #1cc4a8; border-color: #17a68f; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>第一次打开，先把小猪接回家</h1>
  <div id="text">正在下载小猪……</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="error" id="error" hidden></div>
  <div class="buttons" id="buttons" hidden>
    <button class="main" data-act="retry">重试</button>
    <button data-act="page">打开下载页</button>
    <button data-act="quit">退出</button>
  </div>
</main>
<script src="first-run.js"></script>
</body>
</html>
