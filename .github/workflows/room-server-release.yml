# 独立房间服务器发布：推 room-server-v* 标签，或手动指定已有标签。
# 产物与游戏 v* 发布分开；不改桌面协议，也不进游戏包。
name: room-server-release

on:
  push:
    tags: ['room-server-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布标签，例如 room-server-v0.1.0'
        required: true
        type: string
      push_image:
        description: '构建并推送 GHCR Docker 镜像'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: room-server-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag / fmt / test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: apps/room-server-rs
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/room-server-rs -> target
      - name: 校验标签与 Cargo 版本一致
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dsh-piggy-room-server") | .version')"
          test -n "$version"
          expected="room-server-v$version"
          if [ "$TAG" != "$expected" ]; then
            echo "标签 $TAG 与 Cargo.toml 版本不一致，应为 $expected" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 单元 + 集成测试
        run: cargo test --locked

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/room-server-rs -> target
          key: ${{ matrix.target }}-zigbuild
      - name: 构建 release 二进制（glibc 2.17 基线）
        working-directory: apps/room-server-rs
        env:
          # cargo-zigbuild 直接使用宿主环境；--version 里能看到目标平台和提交。
          DSH_PIGGY_ROOM_SERVER_BUILD: '${{ matrix.target }}@${{ github.sha }}'
        run: cargo zigbuild --locked --release --target "${{ matrix.target }}.2.17"
      - name: 打包 tar.gz
        working-directory: apps/room-server-rs
        run: |
          bash scripts/package-release.sh \
            "${{ matrix.target }}" \
            "${{ needs.verify.outputs.version }}" \
            "$GITHUB_WORKSPACE/dist"
      - name: 产物冒烟检查
        run: |
          set -euo pipefail
          asset="dist/dsh-piggy-room-server-${{ needs.verify.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          test -s "$asset"
          tar -tzf "$asset" | sort
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            tar -xzf "$asset" -C "$work"
            "$work/dsh-piggy-room-server-${{ needs.verify.outputs.version }}-linux-x86_64/dsh-piggy-room-server" --version
            "$work/dsh-piggy-room-server-${{ needs.verify.outputs.version }}-linux-x86_64/dsh-piggy-room-server" --help | head -3
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: room-server-${{ matrix.arch }}-${{ needs.verify.outputs.version }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: room-server-*-${{ needs.verify.outputs.version }}
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS 和发布说明
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz | sed 's#  \./#  #' | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          cd ..
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          sed \
            -e "s|{{VERSION}}|$VERSION|g" \
            -e "s|{{TAG}}|$TAG|g" \
            -e "s|{{COMMIT}}|$COMMIT|g" \
            -e "s|{{REPO}}|$REPO|g" \
            -e "s|{{REPO_OWNER_LOWER}}|$owner_lower|g" \
            -e "s|{{ASSET_X86_64}}|dsh-piggy-room-server-$VERSION-linux-x86_64.tar.gz|g" \
            -e "s|{{ASSET_AARCH64}}|dsh-piggy-room-server-$VERSION-linux-aarch64.tar.gz|g" \
            apps/room-server-rs/deploy/RELEASE-NOTES.md > notes.md
          test -s notes.md
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$VERSION" == *-* ]]; then
              gh release edit "$TAG" --title "Room server $VERSION" --notes-file notes.md --prerelease --latest=false
            else
              gh release edit "$TAG" --title "Room server $VERSION" --notes-file notes.md --prerelease=false --latest=false
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--verify-tag --title "Room server $VERSION" --notes-file notes.md --latest=false)
            if [[ "$VERSION" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}" dist/*
          fi

  docker:
    name: Docker build / optional GHCR push
    needs: [verify, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 标签推送时由仓库变量开启；手动触发时由输入决定。没有开启时只构建不推送。
      PUSH_IMAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.push_image) || (github.event_name == 'push' && vars.ROOM_SERVER_PUSH_IMAGE == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 计算小写 GHCR 镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dsh-piggy-room-server" >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR（仅推送时）
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像标签与标签元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(needs.verify.outputs.version, '-') }}
      - name: 构建（推送时才登录并推 GHCR）
        uses: docker/build-push-action@v6
        with:
          context: apps/room-server-rs
          platforms: ${{ env.PUSH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=room-server-docker
          cache-to: type=gha,mode=max,scope=room-server-docker
