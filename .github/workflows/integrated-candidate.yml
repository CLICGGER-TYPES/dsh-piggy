name: Integrated candidate native QA
on:
  push:
    branches: [feat/integrated-candidate-20261027]
  workflow_dispatch:
    inputs:
      public_version:
        description: Exact published npm and GitHub game version to verify (empty builds a candidate)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: integrated-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      PUBLIC_VERSION: ${{ inputs.public_version }}
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build and virtual desktop tools
        run: |
          # The Azure HTTP mirror stalled on fonts in public RC5 verification.
          # This changes only the disposable runner; archive.ubuntu.com is Ubuntu's official mirror.
          sudo python3 -c 'from pathlib import Path; paths=[Path("/etc/apt/sources.list"),*Path("/etc/apt/sources.list.d").glob("*.sources")]; [p.write_text(p.read_text().replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu").replace("https://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")) for p in paths if p.exists()]'
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends libfuse2t64 xvfb openbox picom xdotool scrot dbus-x11 x11-utils fonts-noto-cjk
          npm install --global pnpm@11.28.5
          # Public verification executes the downloaded AppImage, not source Electron.
          if [ -z "$PUBLIC_VERSION" ]; then
            npm ci --prefix apps/desktop --no-audit --no-fund
            npm install --no-save --package-lock=false --no-audit --no-fund esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
          fi
          python3 -m venv "$RUNNER_TEMP/piggy-qa-python"
          "$RUNNER_TEMP/piggy-qa-python/bin/pip" install playwright==1.64.1
          npm install --prefix "$RUNNER_TEMP/piggy-dsh-host" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Build exact game, npm package and AppImage without publishing
        if: inputs.public_version == ''
        run: |
          npm run build
          mkdir -p candidate-qa
          npm pack --ignore-scripts --pack-destination candidate-qa
          node apps/desktop/scripts/release-game.mjs candidate-qa
          node apps/desktop/scripts/pack-game.mjs
          cd apps/desktop
          npx --no-install electron-builder --linux AppImage --x64 --config.linux.artifactName=dsh-piggy-integrated-qa.AppImage --publish never
      - name: Download exact public npm package and GitHub release
        if: inputs.public_version != ''
        env:
          PUBLIC_VERSION: ${{ inputs.public_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const p=require("./package.json");if(process.env.PUBLIC_VERSION!==p.version || !/^\d+\.\d+\.\d+-rc\.\d+$/.test(p.version))throw Error("public version must match checked-out RC")'
          mkdir -p candidate-qa apps/desktop/dist
          npm pack "dsh-piggy@$PUBLIC_VERSION" --ignore-scripts --pack-destination candidate-qa
          shell_version=$(node -p 'require("./apps/desktop/package.json").version')
          gh release download "v$PUBLIC_VERSION" --pattern "dsh-piggy-$shell_version.AppImage" --dir apps/desktop/dist
          mv "apps/desktop/dist/dsh-piggy-$shell_version.AppImage" apps/desktop/dist/dsh-piggy-integrated-qa.AppImage
          gh release download "v$PUBLIC_VERSION" --pattern "game-$PUBLIC_VERSION.json.gz" --pattern "game-$PUBLIC_VERSION.manifest.json" --dir candidate-qa
      - name: Native AppImage and real DSH acceptance
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' "$RUNNER_TEMP/piggy-qa-python/bin/python" apps/desktop/qa/linux-dsh.py --repository "$GITHUB_WORKSPACE" --host "$RUNNER_TEMP/piggy-dsh-host"
      - name: Hash exact candidate outputs
        run: |
          sha256sum apps/desktop/dist/dsh-piggy-integrated-qa.AppImage candidate-qa/*.tgz candidate-qa/*.gz > candidate-qa/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-native-report-${{ github.sha }}
          retention-days: 7
          path: integrated-qa-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-linux-candidate-${{ github.sha }}
          retention-days: 7
          path: |
            apps/desktop/dist/dsh-piggy-integrated-qa.AppImage
            candidate-qa/
