# 发版：推一个 v* 标签（版本号要和根目录 package.json 的 version 一样），自动：
#   1. 跑测试
#   2. 生成桌面版热更新用的游戏包 game-<版本>.json.gz + manifest
#   3. 在 Linux 上打 AppImage、在 Windows 上打安装包和免安装版、在 macOS 上打 dmg（未签名）
#   4. 一同发布 Windows/Linux 外壳更新清单，供新版本的桌面版点击更新
# GitHub 产物挂到这个标签的 Release；npm 主包与别名包由维护者随后手动发布。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '重新构建的已有版本标签（不移动标签）'
        required: true

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 标签要和 package.json 的版本一致
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: 安装桌面测试依赖（纯Node接线测试会导入桌面模块）
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: 测试
        run: |
          npm install --no-save --package-lock=false esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
          npm run build
          git diff --exit-code -- client.js extensions/farm/server.js packages/pet-core/src/data/art-revisions.js apps/desktop/lib/save-owner-lock.js
          npm test
          npm run typecheck
      - name: 游戏包
        run: node apps/desktop/scripts/release-game.mjs dist-game
      - name: 改动说明（CHANGELOG 这一版的小节 + 下载指引；GitHub 再在后面接 PR 与贡献者列表）
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          cat >> notes.md <<'NOTES'

          ### 下载
          - **Windows**：`dsh-piggy-setup-*.exe`（安装版）或 `dsh-piggy-portable-*.exe`（免安装，双击就跑）
          - **Linux**：`dsh-piggy-*.AppImage`（加执行权限后双击）
          - **macOS**：`dsh-piggy-*-arm64.dmg`（M 系列芯片）或 `-x64.dmg`（Intel）。没有签名，第一次打开要在「访达」里**右键 → 打开**；或者终端执行 `xattr -dr com.apple.quarantine /Applications/dsh-piggy.app`
          - **DSH 插件**：按上方精确版本指引安装，装完重启 DSH 并刷新页面
          - 已装桌面版的：「设置 → 更新」可升级游戏包；新安装的 Windows 安装版和 Linux AppImage 也能升级桌面外壳。Windows 便携版、未签名 macOS 版需从本页手动下载。
          NOTES
      - name: 建 Release 并上传游戏包
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes $([[ "$TAG" == *-* ]] && echo --prerelease)
          gh release upload "$TAG" dist-game/* --clobber

  desktop:
    needs: game
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: apps/desktop }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 装依赖
        run: npm ci
      - name: 打包
        shell: bash
        run: |
          node scripts/pack-game.mjs
          if [[ "${{ matrix.target }}" == "--win" ]]; then
            node scripts/pack-optional-extensions.mjs
            npx electron-builder --win nsis --config electron-builder.optional.cjs --publish never
            npx electron-builder --win portable --publish never
            node -e 'const fs=require("node:fs"),p=require("./package.json"); const text=fs.readFileSync("dist/latest.yml","utf8"); if(!text.includes(`dsh-piggy-setup-${p.version}.exe`) || text.includes("portable")) throw Error("Windows updater must reference the full NSIS installer")'
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
      - name: 上传安装包与外壳更新清单
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          update_channel=latest
          # GitHub provider keeps latest filenames inside each separate release.
          # Its prerelease discovery isolates the RC from the stable release.
          if [[ "${{ matrix.target }}" == "--win" ]]; then test -s "dist/${update_channel}.yml"; fi
          if [[ "${{ matrix.target }}" == "--linux" ]]; then test -s "dist/${update_channel}-linux.yml"; fi
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.exe dist/*.dmg "dist/${update_channel}"*.yml)
          test "${#files[@]}" -gt 0
          gh release upload "$TAG" "${files[@]}" --clobber
