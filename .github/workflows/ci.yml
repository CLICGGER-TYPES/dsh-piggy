name: CI
on:
  pull_request:
  push:
    branches: [main, 'review/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    name: Node tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install desktop dependencies without downloading Electron
        run: npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Install pinned build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
      - name: Build
        run: npm run build
      - name: Serial regression tests
        run: node scripts/test.mjs --test-concurrency=1 "test/**/*.test.js" "apps/desktop/test/*.test.js"
      - name: Type check
        run: npm run typecheck
