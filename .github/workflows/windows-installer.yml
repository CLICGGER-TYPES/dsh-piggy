name: Windows offline installer QA
on:
  push:
    branches: [feat/windows-offline-installer-20261027, feat/integrated-candidate-20261027]
    paths-ignore: [apps/desktop/qa/linux-dsh.py, apps/desktop/qa/seed-integration.mjs, .github/workflows/integrated-candidate.yml]
  workflow_dispatch:
    inputs:
      published_tag:
        description: Exact public release tag to install (empty builds a candidate)
        type: string
        default: ""
      verify_icons:
        description: 'Validate approved face icons through Windows Shell and native UI'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-offline-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
      - name: Build game and offline extension payloads
        run: |
          npm run build
          node apps/desktop/scripts/pack-game.mjs
          node apps/desktop/scripts/pack-optional-extensions.mjs
      - name: Validate native QA harness syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('apps/desktop/qa/windows-installer.ps1','apps/desktop/qa/windows-icons.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Error; exit 1 }
          }
      - name: Installer contracts and typecheck
        run: |
          node scripts/test.mjs --test-concurrency=1 apps/desktop/test/optional-extension-pack.test.js apps/desktop/test/optional-extension-runtime.test.js apps/desktop/test/runtime-host.test.js apps/desktop/test/stage-lifecycle-gaps.test.js
          npm run typecheck
      - name: Build full installer without publishing
        if: inputs.published_tag == ''
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win nsis --x64 --config electron-builder.optional.cjs --publish never
      - name: Download official full installer and portable for acceptance
        if: inputs.published_tag != ''
        env:
          PUBLIC_TAG: ${{ inputs.published_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $game = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $shell = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:PUBLIC_TAG -ne "v$game" -or $game -notmatch '^\d+\.\d+\.\d+-rc\.\d+$') { throw 'Public tag must match checked-out RC' }
          New-Item apps/desktop/dist -ItemType Directory -Force | Out-Null
          gh release download $env:PUBLIC_TAG --pattern "dsh-piggy-setup-$shell.exe" --pattern "dsh-piggy-portable-$shell.exe" --pattern latest.yml --dir apps/desktop/dist
          if ($LASTEXITCODE) { throw 'Official release download failed' }
      - name: Native installer and installed-game acceptance
        shell: powershell
        run: |
          $extra = @{}
          if ('${{ inputs.verify_icons }}' -eq 'true') { $extra.CheckIcons = $true }
          if ('${{ inputs.published_tag }}' -ne '') {
            $portable = @(Get-ChildItem apps/desktop/dist/dsh-piggy-portable-*.exe)
            if ($portable.Count -ne 1) { throw 'Expected exactly one public portable executable' }
            $extra.Portable = $portable[0].FullName
          }
          $installer = @(Get-ChildItem apps/desktop/dist/dsh-piggy-setup-*.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one full NSIS candidate" }
          ./apps/desktop/qa/windows-installer.ps1 -Installer $installer[0].FullName -Repository "${{ github.workspace }}" @extra
      - name: Build portable candidate without publishing
        if: inputs.published_tag == ''
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win portable --x64 --publish never
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist/*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content apps/desktop/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-report-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: installer-qa-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-installer-qa-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest.yml
            apps/desktop/dist/SHA256SUMS
            apps/desktop/build/optional-extensions/catalog.json
            apps/desktop/build/optional-extensions/strings.json
            installer-qa-results/
