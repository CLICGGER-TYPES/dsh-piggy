# Gitee 渠道的构建：推 v* 标签时和 release.yml（GitHub）各跑各的。**只构建，不往 Gitee 推任何东西。**
#   - 维护者要求（2026-10-07）：代码、标签、发行版附件一律从维护者本机推 Gitee——GitHub 机房连 Gitee 经常
#     卡死或被重置，CI 的清理步骤还曾先删了旧安装包，Gitee 一段时间没有可下载的安装包。
#   - 这里产出的 artifact：gitee-game（游戏包 + 发布说明）、gitee-dist-<系统>（安装包）。
#     本机执行 `GITEE_TOKEN=… bash scripts/gitee-publish.sh vX.Y.Z` 下载它们并推到 Gitee（见 docs/HANDOFF.md 9.4）。
#   - 构建前切到 gitee 渠道（scripts/set-channel.mjs gitee）：游戏包和桌面外壳里的检查更新、游戏包下载、
#     在线扩展全部指向 gitee.com，构建后扫描，发现 GitHub 地址就失败（第三方库 node_modules 除外）。
#   - Gitee 发行版附件单个 ≤100MiB：安装包用 electron-builder.gitee.cjs（最大压缩、只留中英文语言包）
#     + tools/slim-emoji-font.py 瘦 emoji 字体；mac 的 dmg 再用 hdiutil 转成 lzma（ULMO）；超过的不放进上传清单。
#   - Windows 安装包不带游戏（2026-10-09 起）：先取本次的 gitee-game，写 game-pin.json（版本、校验值、Gitee 下载地址）
#     放进安装包，第一次启动下载（apps/desktop/lib/first-run.js）。游戏包大到超过 95MiB 时 release-game 自动分卷。
name: release-gitee

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发到 Gitee 的版本标签（如 v0.31.0）；代码用你选的分支，package.json 版本要和它一致'
        required: true

permissions:
  contents: read

env:
  GITEE_REPO: clicgger/dsh-piggy
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Gitee 的「100MB」实测是 100MiB：104,500,000 字节能传，105,000,000 字节被拒（2026-10-06）。
  LIMIT: '104857600'

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 版本号要和标签一致
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: 测试（默认渠道，和 GitHub 发版同一套）
        run: |
          npm install --no-save --package-lock=false esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
          npm run build
          npm test
      - name: 切到 gitee 渠道打游戏包
        run: |
          node scripts/set-channel.mjs gitee
          npm run build
          node apps/desktop/scripts/release-game.mjs dist-game
          node scripts/scan-channel.mjs gitee client.js channel.js store dist-game
      - name: 写 Gitee 发布说明
        run: |
          node scripts/release-notes.mjs "$TAG" > dist-game/notes.md
          cat >> dist-game/notes.md <<'NOTES'

          ### 下载（Gitee 版：检查更新、游戏包、在线扩展都走 Gitee）
          - **Windows**：`dsh-piggy-setup-*.exe`（安装版）或 `dsh-piggy-portable-*.exe`（免安装）
          - **Linux**：`dsh-piggy-*.AppImage`（加执行权限后双击）
          - **macOS**：`dsh-piggy-*-arm64.dmg`（M 系列）/ `-x64.dmg`（Intel），没签名，第一次要在访达里右键 → 打开
          - 已装 Gitee 版桌面程序的：主屏「🔄 更新」直接从 Gitee 升级
          NOTES
      - name: 保存游戏包和发布说明（本机推 Gitee 时用）
        uses: actions/upload-artifact@v4
        with:
          name: gitee-game
          path: dist-game/*
          retention-days: 30

  desktop:
    needs: game
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 切到 gitee 渠道、瘦 emoji 字体
        shell: bash
        run: |
          node scripts/set-channel.mjs gitee
          npm install --no-save --package-lock=false esbuild@0.28.2
          npm run build
          python -m pip install --quiet fonttools
          python tools/slim-emoji-font.py
      - name: 取本次的游戏包（Windows 安装包不带游戏，要写下载清单）
        if: matrix.target == '--win'
        uses: actions/download-artifact@v4
        with:
          name: gitee-game
          path: dist-game
      - name: 写 game-pin.json
        if: matrix.target == '--win'
        shell: bash
        run: node apps/desktop/scripts/write-game-pin.mjs dist-game apps/desktop/game-pin.json
      - name: 打包
        shell: bash
        working-directory: apps/desktop
        run: |
          npm ci
          node scripts/pack-game.mjs
          npx electron-builder ${{ matrix.target }} --publish never --config electron-builder.gitee.cjs
      - name: mac 的 dmg 转成 lzma 压缩（macOS 10.15+ 原生能开，比 bzip2 小）
        if: matrix.target == '--mac'
        shell: bash
        working-directory: apps/desktop/dist
        run: |
          for f in *.dmg; do
            hdiutil convert "$f" -format ULMO -o "lzma-$f"
            mv -f "lzma-$f" "$f"
            rm -f "$f.blockmap"
            ls -l "$f"
          done
          # mac 版不走自动更新（未签名，手动下载），转换后清单里的校验值也对不上，不上传
          rm -f latest-mac.yml
      - name: 扫描 GitHub 地址、检查大小
        shell: bash
        run: |
          node scripts/scan-channel.mjs gitee apps/desktop/dist
          shopt -s nullglob
          keep=()
          for f in apps/desktop/dist/*.AppImage apps/desktop/dist/*.exe apps/desktop/dist/*.dmg apps/desktop/dist/latest*.yml apps/desktop/dist/*.blockmap; do
            size=$(node -p "require('fs').statSync(process.argv[1]).size" "$f")
            if [ "$size" -gt "$LIMIT" ]; then echo "::warning::$(basename "$f") 有 $size 字节，超过 Gitee 单附件 100MB，不上传"; else keep+=("$f"); fi
          done
          printf '%s\n' "${keep[@]}" > upload-list.txt
          cat upload-list.txt
      - name: 保存构建产物（本机推 Gitee 时用）
        uses: actions/upload-artifact@v4
        with:
          name: gitee-dist-${{ matrix.os }}
          path: |
            upload-list.txt
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30
